<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dotnet-order-api - API docs</title>
    <!--
      Static snapshot of the OpenAPI spec, generated by scripts/export-openapi.sh (Swashbuckle CLI
      builds the host in-process, no server and no database) and published here by the `pages`
      CI job on every push to main. Swagger UI is only mounted in the Development environment, so
      this is a build-time snapshot, not a live docs server.
    -->
    <style>
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <redoc spec-url="./openapi.json"></redoc>
    <script src="https://cdn.redocly.com/redoc/latest/bundles/redoc.standalone.js"></script>
  </body>
</html>
