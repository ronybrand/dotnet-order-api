name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet format --verify-no-changes
      # Analyzers run as errors (Directory.Build.props), so a clean build is the static-analysis gate.
      - run: dotnet build --no-restore -c Release -warnaserror

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - name: Unit tests
        run: >
          dotnet test src/Test/OrderApi.Test -c Release --no-build
          -p:CollectCoverage=true -p:CoverletOutput=../../../coverage/unit
          -p:CoverletOutputFormat=json
      # tests/integration uses Testcontainers: it starts its own Postgres through Docker, which is
      # already available on GitHub hosted runners. Coverage is measured over unit + integration
      # together (merged), because controllers/middleware/repositories are only exercised by the
      # integration tests - the 80% gate makes no sense for either suite alone.
      - name: Integration tests and coverage gate
        run: >
          dotnet test src/Test/OrderApi.IntegrationTest -c Release --no-build
          -p:CollectCoverage=true -p:CoverletOutput=../../../coverage/merged
          -p:CoverletOutputFormat=json -p:MergeWith=${{ github.workspace }}/coverage/unit.json
          -p:Threshold=80 -p:ThresholdStat=total

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orders
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Database=orders;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet tool restore
      - run: dotnet ef database update --project src/OrderApi.Infrastructure
      # Catches a migration that is out of date relative to the model (e.g. someone changes an
      # entity configuration without generating the migration) before it becomes drift in production.
      - run: dotnet ef migrations has-pending-model-changes --project src/OrderApi.Infrastructure

  docker-build:
    needs: [test, migration]
    runs-on: ubuntu-latest
    # Build-only on PRs (validates the Dockerfile still produces working images); push to GHCR only
    # from main, where GITHUB_TOKEN has package-write on this repo by default - a fork's PR run gets
    # a read-only token, so pushing there would just fail, not add security value.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, worker]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}-${{ matrix.target }}:latest,ghcr.io/${{ github.repository }}-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # Static OpenAPI snapshot: there is no live deployment to browse /swagger on (Swagger is only
  # mounted in Development). scripts/export-openapi.sh builds the host in-process without starting
  # a server or touching a database, so this job needs no Postgres service.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: bash scripts/export-openapi.sh
      - uses: actions/upload-artifact@v7
        with:
          name: openapi-spec
          path: dist-openapi/openapi.json
          if-no-files-found: error
          retention-days: 7

  # Publishes the snapshot as a Redoc page - the only way to see the API shape without cloning the
  # repo. Only on push to main. The github-pages environment/permissions are the contract required
  # by actions/deploy-pages itself.
  pages:
    needs: docs
    # Opt-in: set the repository variable ENABLE_PAGES=true (and enable Pages in the repository
    # settings) to publish. Off by default so a private repository never publishes by accident.
    if: github.event_name == 'push' && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: openapi-spec
          path: site
      - run: cp docs/api-docs/index.html site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
